<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Camera & Screen Monitor</title>
    <!-- Library Client -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #121212; color: #fff; display: flex; flex-direction: column; min-height: 100vh; }
        header { background-color: #1f1f1f; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .gear-btn { background: none; border: none; color: #fff; font-size: 1.6rem; cursor: pointer; }
        .status-badge { font-size: 0.8rem; padding: 4px 8px; border-radius: 4px; background: #555; }
        .online { background: #28a745; }
        .container { padding: 20px; text-align: center; flex: 1; }
        video { width: 100%; max-width: 450px; border-radius: 10px; background: #000; margin: 15px 0; }
        .btn { padding: 12px 20px; margin: 5px; font-size: 1rem; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; color: white; }
        .btn-green { background-color: #28a745; }
        .btn-red { background-color: #dc3545; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 1000; }
        .modal-box { background: #222; padding: 25px; border-radius: 12px; width: 90%; max-width: 320px; text-align: center; }
        .modal-box input { width: 100%; padding: 10px; margin: 15px 0; border-radius: 6px; border: 1px solid #444; background: #111; color: #fff; text-align: center; font-size: 1.1rem; }
        .admin-gui { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #181818; z-index: 2000; overflow-y: auto; padding: 20px; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .stream-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; }
        .stream-card { background: #252525; padding: 10px; border-radius: 8px; border: 1px solid #333; }
    </style>
</head>
<body>

    <header>
        <div>
            <strong>Live Monitor</strong>
            <span id="peerStatus" class="status-badge">Menghubungkan...</span>
        </div>
        <button class="gear-btn" onclick="openModal()">⚙️</button>
    </header>

    <div class="container">
        <h2>Live Screen & Camera Stream</h2>
        <p>Aplikasi siap melakukan penyiaran di latar belakang.</p>
        
        <video id="localPreview" autoplay muted playsinline></video>
        <br>
        <button class="btn btn-green" onclick="startBroadcast()">Mulai Live Broadcast</button>
        <button class="btn btn-red" onclick="stopBroadcast()">Hentikan</button>
    </div>

    <!-- Modal Sandi Rahasia -->
    <div class="modal" id="pinModal">
        <div class="modal-box">
            <h3>Akses Monitor Live</h3>
            <p>Masukkan Kode Rahasia:</p>
            <input type="password" id="pinInput" placeholder="Kode PIN">
            <button class="btn btn-green" onclick="verifyPin()">Masuk</button>
            <button class="btn btn-red" onclick="closeModal()">Batal</button>
        </div>
    </div>

    <!-- GUI Admin / Pemantau Live Kamera -->
    <div class="admin-gui" id="adminGUI">
        <div class="admin-header">
            <h2>Live Stream dari HP Lain</h2>
            <button class="btn btn-red" onclick="closeAdminGUI()">Tutup</button>
        </div>
        <div class="stream-grid" id="streamGrid"></div>
    </div>

    <script>
        const SERVER_URL = "http://192.168.1.10:9000"; // GANTI DENGAN IP SERVER ANDA
        const SERVER_HOST = "192.168.1.10";          // GANTI DENGAN IP SERVER ANDA
        const SECRET_PIN = "312312322";

        let peer;
        let socket;
        let localStream;
        let myPeerId;

        function initConnections() {
            // 1. Hubungkan ke Socket.IO Server
            socket = io(SERVER_URL);

            // 2. Hubungkan ke PeerJS Server
            myPeerId = "hp-" + Math.floor(1000 + Math.random() * 9000);
            peer = new Peer(myPeerId, {
                host: SERVER_HOST,
                port: 9000,
                path: '/peerjs'
            });

            peer.on('open', (id) => {
                document.getElementById('peerStatus').innerText = "Online ID: " + id;
                document.getElementById('peerStatus').classList.add('online');
            });

            // Menerima Panggilan Stream dari Admin
            peer.on('call', (call) => {
                call.answer(localStream);
            });

            // Memperbarui tampilan Admin saat ada daftar HP aktif dari server
            socket.on('update-broadcaster-list', (broadcasterIds) => {
                const grid = document.getElementById('streamGrid');
                grid.innerHTML = ""; // Clear list

                broadcasterIds.forEach(id => {
                    if (id !== myPeerId) {
                        connectToDevice(id);
                    }
                });
            });
        }

        async function startBroadcast() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('localPreview').srcObject = localStream;

                // Daftarkan ID HP ini ke server sebagai pengirim aktif
                socket.emit('register-broadcaster', myPeerId);
                alert("Live Broadcast Berhasil!");
            } catch (err) {
                alert("Gagal membuka kamera: " + err.message);
            }
        }

        function stopBroadcast() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                document.getElementById('localPreview').srcObject = null;
            }
        }

        function openModal() { document.getElementById('pinModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('pinModal').style.display = 'none'; document.getElementById('pinInput').value = ''; }

        function verifyPin() {
            if (document.getElementById('pinInput').value === SECRET_PIN) {
                closeModal();
                openAdminGUI();
            } else {
                alert("Sandi Rahasia Salah!");
            }
        }

        function openAdminGUI() {
            document.getElementById('adminGUI').style.display = 'block';
            socket.emit('get-broadcasters'); // Minta daftar HP aktif dari server
        }

        function closeAdminGUI() {
            document.getElementById('adminGUI').style.display = 'none';
        }

        function connectToDevice(targetPeerId) {
            if (!localStream) {
                // Buat dummy stream atau panggil langsung jika admin ingin melihat
                const call = peer.call(targetPeerId, new MediaStream());
                call.on('stream', (remoteStream) => {
                    addRemoteVideoStream(targetPeerId, remoteStream);
                });
            } else {
                const call = peer.call(targetPeerId, localStream);
                call.on('stream', (remoteStream) => {
                    addRemoteVideoStream(targetPeerId, remoteStream);
                });
            }
        }

        function addRemoteVideoStream(peerId, stream) {
            const grid = document.getElementById('streamGrid');
            if (document.getElementById("video-" + peerId)) return;

            const card = document.createElement('div');
            card.className = 'stream-card';
            card.id = "card-" + peerId;

            const title = document.createElement('h4');
            title.innerText = "Live Stream: " + peerId;

            const video = document.createElement('video');
            video.id = "video-" + peerId;
            video.autoplay = true;
            video.playsinline = true;
            video.style.width = "100%";
            video.style.borderRadius = "6px";
            video.srcObject = stream;

            card.appendChild(title);
            card.appendChild(video);
            grid.appendChild(card);
        }

        window.onload = initConnections;
    </script>
</body>
</html>
